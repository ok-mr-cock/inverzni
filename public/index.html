<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverzní funkce: soutěž</title>
<style>
:root{--bg:#12263A;--card:#1B3550;--ink:#fff;--dark:#1B2430;--teal:#2EC4B6;--orange:#FF9F1C;--red:#E63946;--yellow:#FFE8A3;--green:#3DDC84;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Calibri,"Segoe UI",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font:700 26px Cambria,Georgia,serif;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:20px;padding:4px 12px;font-weight:700;color:var(--orange)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
.zad{background:var(--yellow);color:var(--dark);border-radius:14px;padding:12px 16px;font-size:19px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media(max-width:620px){.duo{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;align-items:center}
.bub{background:#fff;color:var(--dark);border-radius:22px;padding:16px 18px;width:100%;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.35);min-height:96px;display:flex;align-items:center}
.bub:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-14px;border:14px solid transparent;border-bottom:0;border-top-color:#fff}
.av{width:84px;height:84px;margin-top:16px}
.lbl{font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px 10px;color:var(--dark);background:var(--teal);cursor:pointer;min-height:56px}
button.o{background:var(--orange)}button.y{background:var(--yellow)}button.g{background:#C9D6E2}button.t{background:#fff;padding:12px 22px}
button:disabled{opacity:.45;cursor:default}
.sel{outline:4px solid #fff}
input{font:inherit;padding:14px;border-radius:12px;border:0;width:100%;max-width:340px}
.ok{color:var(--green)}.bad{color:#FF8A94}
.row{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px}
.row:nth-child(odd){background:rgba(255,255,255,.07)}.me{outline:2px solid var(--orange)}
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--orange);width:100%}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.dist b{display:block;font-size:26px}
.hide{display:none}.gr{width:100%;max-width:320px;display:block;margin:12px auto}
</style></head><body><main>
<div class="top"><h1>🔁 Inverzní funkce</h1><span class="chip" id="chip"></span></div>
<div id="v"></div>
</main>
<script>
let TASKS=[];
const FEM=["Bára","Dana","Eva","Jana","Lída"],SK=["F2C6A0","D9A27A","A66E4B","FFDDBF"],HR=["2B2118","6B4423","C98B2B","1F2937","8C3B2E"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ws=null,ready=false,denied=false,uid=null,teacher=false,state={idx:0,phase:"lobby"},players={},shownAt=0,lastKey="",tick=null,pin=null,retry=0;
const WANT_T=location.pathname.indexOf("/ucitel")===0;

function avatar(name,col,seed){
  const sk=SK[seed%4],hr=HR[(seed*3+1)%5],f=FEM.includes(name),cap=!f&&seed%2===0,top=cap?"#E63946":"#"+hr;
  return `<svg viewBox="0 0 100 100" class="av" aria-hidden="true">${f?`<rect x="26" y="14" width="48" height="54" rx="22" fill="#${hr}"/>`:""}<path d="M12 100V86a18 18 0 0 1 18-18h40a18 18 0 0 1 18 18v14z" fill="#${col}"/><rect x="43" y="56" width="14" height="16" fill="#${sk}"/><circle cx="50" cy="40" r="22" fill="#${sk}"/><path d="M27 38C27 20 38 14 50 14S73 20 73 38C66 30 34 30 27 38Z" fill="${top}"/>${cap?`<rect x="48" y="30" width="30" height="5" rx="2" fill="${top}"/>`:""}<circle cx="41" cy="42" r="2.6" fill="#1B2430"/><circle cx="59" cy="42" r="2.6" fill="#1B2430"/><ellipse cx="50" cy="52" rx="6" ry="2.6" fill="#B23A48"/></svg>`;
}
const tot=p=>Object.values((p&&p.pts)||{}).reduce((a,b)=>a+b,0);
const me=()=>players[uid];
function plot(p){
  const S=25,O=150;let h='<svg viewBox="0 0 300 300" class="gr" role="img" aria-label="graf"><rect width="300" height="300" rx="12" fill="#0E1D2C"/>';
  for(let k=-6;k<=6;k++){const c=O+k*S;h+=`<path d="M${c} 0V300M0 ${c}H300" stroke="${k===0?"#9FB3C8":"#2A4560"}" stroke-width="${k===0?1.6:1}"/>`}
  for(const k of [-4,-2,2,4,6])h+=`<text x="${O+k*S}" y="${O+12}" font-size="10" fill="#9FB3C8" text-anchor="middle">${k}</text><text x="${O-4}" y="${O-k*S+3}" font-size="10" fill="#9FB3C8" text-anchor="end">${k}</text>`;
  h+='<path d="M0 300L300 0" stroke="#C9D6E2" stroke-dasharray="6 5" stroke-width="1.5"/>';
  for(const [e,col] of [[p.f,"#3DDC84"],[p.g,"#FF9F1C"]]){if(!e)continue;
    const fn=new Function("x","return "+e);let d="",pen=false;
    for(let j=0;j<=600;j++){const x=-6+j*0.02,y=fn(x);if(!isFinite(y)||Math.abs(y)>6.4){pen=false;continue}d+=(pen?"L":"M")+(O+x*S).toFixed(1)+" "+(O-y*S).toFixed(1);pen=true}
    h+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`}
  return h+"</svg>";
}
function cartoon(t,i){
  if(t.mc)return `<div class="zad"><b>Zadání:</b> ${t.zad}</div>${t.plot?plot(t.plot):""}`;
  return `<div class="zad"><b>Zadání:</b> ${t.zad}</div><div class="duo">
  <div class="side"><div class="bub">${t.t1}</div>${avatar(t.n1,"2EC4B6",i*2)}<div class="lbl">A: ${t.n1}</div></div>
  <div class="side"><div class="bub">${t.t2}</div>${avatar(t.n2,"FF9F1C",i*2+1)}<div class="lbl">B: ${t.n2}</div></div></div>`;
}
function lbHtml(n){
  const arr=Object.entries(players).map(([id,p])=>({id,name:p.name,s:tot(p)})).sort((a,b)=>b.s-a.s);
  let rows=arr.slice(0,n).map((p,k)=>`<div class="row${p.id===uid?" me":""}"><span>${k+1}. ${esc(p.name)}</span><b>${p.s}</b></div>`);
  const k=arr.findIndex(p=>p.id===uid);
  if(k>=n)rows.push(`<div class="row me"><span>${k+1}. ${esc(arr[k].name)}</span><b>${arr[k].s}</b></div>`);
  return rows.join("")||"<i>Zatím nikdo.</i>";
}
function label(t){if(t.mc)return "Správná je možnost "+t.ans+": "+t.mc["ABCD".indexOf(t.ans)];return {AB:"Pravdu mají oba (A i B)",N:"Nemá pravdu nikdo",A:"Pravdu má A – "+t.n1,B:"Pravdu má B – "+t.n2}[t.ans]}
const opts=t=>t.mc?t.mc.map((x,k)=>["ABCD"[k],"ABCD"[k]+": "+x,["","o","y","g"][k]]):[["A","A: "+t.n1,""],["B","B: "+t.n2,"o"],["AB","A i B","y"],["N","Ani jeden","g"]];

function build(){
  const i=state.idx||0,t=TASKS[i],ph=state.phase||"lobby",mine=me(),N=TASKS.length;
  if(WANT_T&&!teacher)return `<div class="card"><h2>Učitel</h2>${denied?'<p class="bad">Špatný PIN.</p>':""}<input id="pin" type="password" inputmode="numeric" placeholder="PIN"><div style="margin-top:12px"><button class="t" id="pn">Přihlásit</button></div></div>`;
  if(!ready)return `<div class="card">Připojuji se k serveru…</div>`;
  if(ph==="end")return `<div class="card"><h2>🏆 Konečné pořadí</h2><div id="lb"></div></div>`+(teacher?`<button class="t" id="nw">Nová hra (smaže hráče)</button>`:"");
  if(teacher&&ph==="lobby")return `<div class="card"><h2>Čekárna</h2><p>Žáci otevřou stejný odkaz a zadají jméno. Připojeno: <b id="cnt">0</b></p><div id="lb"></div></div><button class="t" id="go">Spustit hru (${N} úloh)</button>`;
  if(!mine&&!teacher)return `<div class="card"><h2>Připoj se</h2><p>Zadej přezdívku (stačí jméno).</p><input id="nm" maxlength="20" placeholder="Jméno"><div style="margin-top:12px"><button class="t" id="jn">Připojit se</button></div></div>`;
  if(!teacher&&ph==="lobby")return `<div class="card"><h2>Ahoj ${esc(mine.name)}!</h2><p>Čekej, až učitel spustí hru. Připojeno: <b id="cnt">0</b></p></div>`;
  const head=`<div class="top"><span class="chip">Úloha ${i+1} / ${N} · ${t.tema}</span><span class="chip">${"●".repeat(t.lvl)}${"○".repeat(3-t.lvl)}</span></div>`;
  if(ph==="question"){
    const a=mine&&mine.answers&&mine.answers[i];
    let body="";
    if(teacher)body=`<div class="card">Odpovědělo <b id="ans">0</b> z <b id="cnt">0</b></div><button class="t" id="rv">Odhalit odpověď</button>`;
    else if(a)body=`<div class="card">Tvoje odpověď: <b>${esc(opts(t).find(o=>o[0]===a.c)[1])}</b>. Čekej na odhalení.</div>`;
    else body=`<div class="bar"><i id="tm"></i></div><div class="btns">${opts(t).map(o=>`<button class="${o[2]}" data-c="${o[0]}">${esc(o[1])}</button>`).join("")}</div>`;
    return head+cartoon(t,i)+body;
  }
  const a=mine&&mine.answers&&mine.answers[i],p=mine&&mine.pts&&mine.pts[i];
  const res=teacher?"":a?(a.c===t.ans?`<p class="ok"><b>Správně! +<span id="pt">${p===undefined?"…":p}</span> b.</b></p>`:`<p class="bad"><b>Tentokrát ne.</b> 0 b.</p>`):`<p class="bad">Neodpověděl/a jsi. 0 b.</p>`;
  return head+`<div class="card"><h2 class="ok">${label(t)}</h2>${res}<p><b>Správný výsledek:</b> ${t.res}</p><p><b>V čem je chyba:</b> ${t.who}</p><p><i>${t.tip}</i></p>${t.plot?plot(t.plot):""}${teacher?'<div class="dist" id="dist"></div>':""}</div>`+
    `<div class="card"><h3>Pořadí</h3><div id="lb"></div></div>`+
    (teacher?(i+1<N?`<button class="t" id="nx">Další úloha</button>`:`<button class="t" id="en">Ukončit a ukázat pořadí</button>`):"");
}
function refresh(){
  const i=state.idx||0,t=TASKS[i],ph=state.phase,list=Object.values(players);
  const set=(s,h)=>{const e=$(s);if(e)e.innerHTML=h};
  set("#cnt",list.length);set("#lb",lbHtml(teacher||ph==="end"?10:5));
  set("#ans",list.filter(p=>p.answers&&p.answers[i]).length);
  if(teacher&&ph==="reveal"){const c={};opts(t).forEach(o=>c[o[0]]=0);list.forEach(p=>{const a=p.answers&&p.answers[i];if(a)c[a.c]++});
    set("#dist",opts(t).map(o=>`<div><b>${c[o[0]]}</b>${esc(o[1])}${o[0]===t.ans?" ✓":""}</div>`).join(""))}
  const m=me();
  if(!teacher&&m&&ph==="reveal"){const p=m.pts&&m.pts[i];if(p!==undefined)set("#pt",p)}
}
function render(){
  const m=me(),key=[state.phase,state.idx,ready,denied,m?1:0,m&&m.answers&&m.answers[state.idx]?1:0,teacher].join("|");
  if(key!==lastKey){
    lastKey=key;
    if(state.phase==="question")shownAt=Date.now();
    $("#v").innerHTML=build();bind();
    clearInterval(tick);
    if(state.phase==="question"&&!teacher&&$("#tm"))tick=setInterval(()=>{const e=$("#tm");if(e)e.style.width=Math.max(0,100-(Date.now()-shownAt)/300)+"%"},200);
  }
  $("#chip").textContent=teacher?"Učitel":m?m.name+" · "+tot(m)+" b.":"";
  refresh();
}
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function bind(){
  const on=(q,f)=>{const e=$(q);if(e)e.onclick=f};
  on("#go",()=>send({t:"go"}));
  on("#rv",()=>send({t:"reveal"}));
  on("#nx",()=>send({t:"next"}));
  on("#en",()=>send({t:"end"}));
  const nw=$("#nw");
  if(nw)nw.onclick=()=>{
    if(nw.dataset.s!=="1"){nw.dataset.s="1";nw.textContent="Opravdu? Klikni znovu";return}
    send({t:"new"});
  };
  on("#jn",()=>{const n=($("#nm").value||"").trim().slice(0,20);if(n)send({t:"join",name:n})});
  on("#pn",()=>{const v=($("#pin").value||"").trim();if(!v)return;pin=v;denied=false;connect()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    const m=me(),i=state.idx||0;if(!m||(m.answers&&m.answers[i]))return;
    document.querySelectorAll("[data-c]").forEach(x=>x.disabled=true);b.classList.add("sel");
    send({t:"answer",c:b.dataset.c});
  });
}
function connect(){
  if(ws){ws.onclose=null;try{ws.close()}catch(e){}}
  ready=false;
  const w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws=w;
  w.onopen=()=>{retry=0;w.send(JSON.stringify({t:"hello",id:uid,pin:WANT_T?pin:undefined}))};
  w.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==="hello"){teacher=!!m.teacher;ready=true;denied=false}
    else if(m.t==="denied"){denied=true;teacher=false;pin=null;ready=false;w.onclose=null;w.close()}
    else if(m.t==="state"){state=m.state;players=m.players;ready=true}
    render();
  };
  w.onclose=()=>{ready=false;render();setTimeout(connect,Math.min(1000*++retry,5000))};
}
(async()=>{
  const rnd=()=>Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  try{uid=localStorage.getItem("kmp_id");if(!uid||uid.length<6){uid=rnd();localStorage.setItem("kmp_id",uid)}}catch(e){uid=rnd()}
  $("#v").innerHTML=`<div class="card">Načítám…</div>`;
  try{TASKS=await (await fetch("/ulohy.json")).json()}catch(e){$("#v").innerHTML=`<div class="card bad">Nepodařilo se načíst úlohy.</div>`;return}
  if(WANT_T){render();return}
  connect();render();
})();
</script></body></html>
